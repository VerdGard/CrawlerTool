name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK=$APK"
          # 32.0.0 起 apksigner 命令为 build-tools 下的可执行文件
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            echo "apksigner not found, skip verification"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawler-tool-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v1.6.${{ github.run_number }}
          name: Crawler Tool v1.6 (${{ github.run_number }})
          draft: false
          generate_release_notes: true
          body: |
            **构建号**:${{ github.run_number }}
            **提交**:${{ github.event.head_commit.message }}
            **作者**:@${{ github.event.head_commit.author.username }}

            安装包为 release 签名版本,可直接覆盖安装 v1.5 及更早版本。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
