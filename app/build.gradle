plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.SoloSu.Crawler_tool'
    compileSdk 36

    defaultConfig {
        applicationId 'com.SoloSu.Crawler_tool'
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "1.5"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        // release 走仓库内置 keystore(与 LuaForge-Studio 同一 key),
        // CI 与本地行为一致,产物可直接安装覆盖旧版本。
        release {
            storeFile rootProject.file(project.findProperty('crawler.storeFile') as String
                ?: 'keystore/crawler-release.jks')
            storePassword project.findProperty('crawler.storePassword') as String ?: 'luaappxcore'
            keyAlias project.findProperty('crawler.keyAlias') as String ?: 'luaappxcore'
            keyPassword project.findProperty('crawler.keyPassword') as String ?: 'luaappxcore'
            // 仅在文件存在时启用,避免 keystore 缺失直接中断其它构建任务
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // Lifecycle + ViewModel
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.livedata.ktx

    // Jsoup - HTML 解析 + XPath 匹配
    implementation libs.jsoup

    // OkHttp - 网络请求
    implementation libs.okhttp

    // Coil - 图片加载
    implementation libs.coil
}
