plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.SoloSu.Crawler_tool'
    compileSdk 36

    defaultConfig {
        applicationId 'com.SoloSu.Crawler_tool'
        minSdk 30
        targetSdk 34
        versionCode 8
        versionName "1.5"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        // release 走仓库内置 keystore(与 LuaForge-Studio 同一 key),
        // CI 与本地行为一致,产物可直接安装覆盖旧版本。
        release {
            storeFile rootProject.file(project.findProperty('crawler.storeFile') as String
                ?: 'keystore/crawler-release.jks')
            storePassword project.findProperty('crawler.storePassword') as String ?: 'luaappxcore'
            keyAlias project.findProperty('crawler.keyAlias') as String ?: 'luaappxcore'
            keyPassword project.findProperty('crawler.keyPassword') as String ?: 'luaappxcore'
            // 仅在文件存在时启用,避免 keystore 缺失直接中断其它构建任务
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        // 界面已全部迁移到 Compose,不再生成 ViewBinding
        compose true
        // 设置页「关于」需要读 versionName
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module']
        }
    }

    // Compose 相关类在 release 下没有 R8 会留下大量无用代码
    lint {
        checkDependencies true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    // Compose:版本由 BOM 统一裁定,各库不写 version
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling

    implementation libs.androidx.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose

    // Lifecycle + ViewModel
    implementation libs.lifecycle.viewmodel
    implementation libs.kotlinx.coroutines.android

    // Jsoup - HTML 解析 + XPath 匹配
    implementation libs.jsoup

    // OkHttp - 网络请求
    implementation libs.okhttp
}
