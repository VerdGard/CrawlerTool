# ============================================
# Gradle 全局属性(跨平台通用,勿写入机器相关绝对路径)
# ============================================
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official

# 统一 UTF-8,避免中文资源在 CI / 本地编译时乱码
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# --- 签名信息(release 构建读取;值来源于内置 keystore)---
# 如需更换签名,仅改这四项即可
crawler.storeFile=keystore/crawler-release.jks
crawler.storePassword=luaappxcore
crawler.keyAlias=luaappxcore
crawler.keyPassword=luaappxcore

# 注:Termux/AndroidIDE 环境下若需覆盖 aapt2,请写在 ~/.gradle/gradle.properties,
# 不要提交到仓库(CI 上不存在 /data/data/com.termux 路径)。
